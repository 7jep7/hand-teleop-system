<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Test Page</title>
    <style>
        body { 
            background: #1f2937; 
            color: white; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
        }
        .test-box {
            background: #374151;
            padding: 20px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="test-box">
        <h1>Frontend Test Page</h1>
        <p>✅ Basic HTML/CSS loading correctly</p>
        <div id="js-test">⏳ Testing JavaScript...</div>
        <div id="fetch-test">⏳ Testing Backend Connection...</div>
        <div id="react-test">⏳ Testing React...</div>
    </div>

    <script>
        // Test 1: Basic JavaScript
        try {
            document.getElementById('js-test').innerHTML = '<span class="success">✅ JavaScript working</span>';
        } catch (e) {
            document.getElementById('js-test').innerHTML = '<span class="error">❌ JavaScript error: ' + e.message + '</span>';
        }

        // Test 2: Backend connection
        fetch('http://localhost:8000/api/health')
            .then(response => response.json())
            .then(data => {
                document.getElementById('fetch-test').innerHTML = '<span class="success">✅ Backend connection: ' + JSON.stringify(data) + '</span>';
            })
            .catch(error => {
                document.getElementById('fetch-test').innerHTML = '<span class="error">❌ Backend connection failed: ' + error.message + '</span>';
            });
    </script>

    <!-- Test 3: React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script>
        try {
            if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined') {
                document.getElementById('react-test').innerHTML = '<span class="success">✅ React libraries loaded</span>';
                
                // Try to create a simple React component
                const TestComponent = React.createElement('div', {
                    style: { background: '#10b981', padding: '10px', margin: '10px 0', borderRadius: '4px' }
                }, 'React component rendering successfully!');
                
                const container = document.createElement('div');
                document.body.appendChild(container);
                
                const root = ReactDOM.createRoot(container);
                root.render(TestComponent);
            } else {
                document.getElementById('react-test').innerHTML = '<span class="error">❌ React libraries not loaded</span>';
            }
        } catch (e) {
            document.getElementById('react-test').innerHTML = '<span class="error">❌ React error: ' + e.message + '</span>';
        }
    </script>
</body>
</html>
