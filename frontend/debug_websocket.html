<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        button { background: #0070f3; color: white; border: none; padding: 10px 20px; margin: 5px; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #666; cursor: not-allowed; }
        #log { background: #222; padding: 15px; border-radius: 5px; height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
        video, canvas { border: 2px solid #333; margin: 10px; }
        .controls { margin: 20px 0; }
        .backend-select { margin: 20px 0; padding: 15px; background: #333; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebSocket Debug Test</h1>
        
        <div class="backend-select">
            <h3>Backend Selection:</h3>
            <label><input type="radio" name="backend" value="local" checked> Local (localhost:8000)</label><br>
            <label><input type="radio" name="backend" value="deployed"> Deployed (hand-teleop-api.onrender.com)</label>
        </div>
        
        <div class="controls">
            <button id="connectBtn">Connect WebSocket</button>
            <button id="disconnectBtn" disabled>Disconnect</button>
            <button id="startCameraBtn" disabled>Start Camera</button>
            <button id="sendTestBtn" disabled>Send Test Frame</button>
            <button id="clearBtn">Clear Log</button>
        </div>
        
        <div style="display: flex; gap: 20px;">
            <div>
                <h3>Camera Feed</h3>
                <video id="video" width="320" height="240" autoplay muted></video>
            </div>
            <div>
                <h3>Processed Output</h3>
                <canvas id="canvas" width="320" height="240"></canvas>
            </div>
        </div>
        
        <h3>Debug Log</h3>
        <div id="log"></div>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const startCameraBtn = document.getElementById('startCameraBtn');
        const sendTestBtn = document.getElementById('sendTestBtn');
        const clearBtn = document.getElementById('clearBtn');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const log = document.getElementById('log');
        
        let ws = null;
        let stream = null;
        let isStreaming = false;
        
        function addLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            log.textContent += `[${timestamp}] ${message}\n`;
            log.scrollTop = log.scrollHeight;
            console.log(message);
        }
        
        function clearLog() {
            log.textContent = '';
        }
        
        connectBtn.addEventListener('click', () => {
            const backend = document.querySelector('input[name="backend"]:checked').value;
            const wsUrl = backend === 'local' 
                ? 'ws://localhost:8000/api/tracking/live'
                : 'wss://hand-teleop-api.onrender.com/api/tracking/live';
            
            addLog(`Attempting to connect to: ${wsUrl}`);
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = function(event) {
                    addLog('✅ WebSocket connected successfully!');
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = false;
                    startCameraBtn.disabled = false;
                    sendTestBtn.disabled = false;
                };
                
                ws.onmessage = function(event) {
                    addLog('📨 Received message:');
                    try {
                        const data = JSON.parse(event.data);
                        addLog(`   Type: ${data.type}`);
                        
                        if (data.type === 'tracking_result' && data.data) {
                            addLog(`   Hand detected: ${data.data.hand_detected}`);
                            if (data.data.processing_time_ms) {
                                addLog(`   Processing time: ${data.data.processing_time_ms}ms`);
                            }
                            
                            // Draw annotated image if available
                            if (data.data.annotated_image) {
                                const img = new Image();
                                img.onload = function() {
                                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                                };
                                img.src = data.data.annotated_image;
                                addLog('   📸 Annotated image received and displayed');
                            }
                            
                            if (data.data.fingertip_coords) {
                                const coords = data.data.fingertip_coords;
                                addLog(`   👆 Fingertips - Thumb: (${coords.thumb_tip.x.toFixed(3)}, ${coords.thumb_tip.y.toFixed(3)})`);
                                addLog(`                Index: (${coords.index_tip.x.toFixed(3)}, ${coords.index_tip.y.toFixed(3)})`);
                            }
                        } else if (data.type === 'pong') {
                            addLog('   🏓 Pong received');
                        } else {
                            addLog(`   Data: ${JSON.stringify(data).substring(0, 100)}...`);
                        }
                    } catch (e) {
                        addLog(`   Raw data: ${event.data.substring(0, 100)}...`);
                    }
                };
                
                ws.onclose = function(event) {
                    addLog(`❌ WebSocket closed (code: ${event.code}, reason: ${event.reason})`);
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                    startCameraBtn.disabled = true;
                    sendTestBtn.disabled = true;
                    isStreaming = false;
                };
                
                ws.onerror = function(error) {
                    addLog(`💥 WebSocket error: ${error}`);
                    console.error('WebSocket error:', error);
                };
                
            } catch (error) {
                addLog(`💥 Failed to create WebSocket: ${error.message}`);
            }
        });
        
        disconnectBtn.addEventListener('click', () => {
            if (ws) {
                ws.close();
                isStreaming = false;
            }
        });
        
        startCameraBtn.addEventListener('click', async () => {
            try {
                addLog('🎥 Starting camera...');
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 }
                });
                video.srcObject = stream;
                addLog('✅ Camera started successfully');
                
                // Start streaming frames
                setTimeout(startFrameCapture, 1000);
                
            } catch (error) {
                addLog(`💥 Camera error: ${error.message}`);
            }
        });
        
        function startFrameCapture() {
            if (!ws || ws.readyState !== WebSocket.OPEN || !stream) return;
            
            isStreaming = true;
            addLog('🎬 Starting frame capture...');
            
            function captureFrame() {
                if (!isStreaming || !ws || ws.readyState !== WebSocket.OPEN) return;
                
                // Create canvas to capture frame
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = video.videoWidth;
                tempCanvas.height = video.videoHeight;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(video, 0, 0);
                
                // Convert to base64
                const imageData = tempCanvas.toDataURL('image/jpeg', 0.8);
                
                // Send to backend
                const message = {
                    type: 'image',
                    data: imageData,
                    timestamp: Date.now()
                };
                
                try {
                    ws.send(JSON.stringify(message));
                    addLog(`📤 Sent frame (${Math.round(imageData.length/1024)}KB)`);
                } catch (error) {
                    addLog(`💥 Failed to send frame: ${error.message}`);
                    isStreaming = false;
                    return;
                }
                
                // Continue capturing at ~10 FPS
                setTimeout(captureFrame, 100);
            }
            
            captureFrame();
        }
        
        sendTestBtn.addEventListener('click', () => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addLog('💥 WebSocket not connected');
                return;
            }
            
            const testMessage = {
                type: 'ping',
                timestamp: Date.now()
            };
            
            try {
                ws.send(JSON.stringify(testMessage));
                addLog('📤 Sent ping message');
            } catch (error) {
                addLog(`💥 Failed to send test message: ${error.message}`);
            }
        });
        
        clearBtn.addEventListener('click', clearLog);
        
        // Initialize
        addLog('🚀 WebSocket Debug Test initialized');
        addLog('1. Select backend (Local or Deployed)');
        addLog('2. Click Connect WebSocket');
        addLog('3. Click Start Camera');
        addLog('4. Watch for tracking results');
    </script>
</body>
</html>
