<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test - Hand Tracking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .status {
            background: #333;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .controls {
            background: #333;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        button {
            background: #0070f3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            margin: 5px;
            cursor: pointer;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #output {
            background: #222;
            padding: 15px;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        video {
            width: 320px;
            height: 240px;
            background: black;
            border-radius: 5px;
        }
        .data-section {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .fingertip-data {
            background: #333;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebSocket Test - Hand Tracking</h1>
        
        <div class="status">
            <div>Status: <span id="connection-status">Disconnected</span></div>
            <div>Hand Detected: <span id="hand-status">No</span></div>
            <div>Processing Time: <span id="processing-time">0ms</span></div>
        </div>
        
        <div class="controls">
            <div style="margin-bottom: 15px;">
                <label style="margin-right: 20px;">
                    <input type="radio" name="backend" value="local" checked style="margin-right: 5px;">
                    Local Backend (localhost:8000)
                </label>
                <label>
                    <input type="radio" name="backend" value="deployed" style="margin-right: 5px;">
                    Deployed Backend (hand-teleop-api.onrender.com)
                </label>
            </div>
            <button id="connect-btn">Connect WebSocket</button>
            <button id="start-camera-btn" disabled>Start Camera</button>
            <button id="stop-camera-btn" disabled>Stop Camera</button>
            <button id="send-ping-btn" disabled>Send Ping</button>
            <button id="clear-log-btn">Clear Log</button>
        </div>
        
        <div class="data-section">
            <div>
                <h3>Camera Feed</h3>
                <video id="video" autoplay muted></video>
            </div>
            <div>
                <h3>Fingertip Data</h3>
                <div id="fingertip-data" class="fingertip-data">
                    No fingertip data yet...
                </div>
            </div>
        </div>
        
        <h3>WebSocket Log</h3>
        <div id="output">Waiting for connection...</div>
    </div>

    <script>
        let ws = null;
        let video = null;
        let canvas = null;
        let streaming = false;
        let streamInterval = null;

        const connectBtn = document.getElementById('connect-btn');
        const startCameraBtn = document.getElementById('start-camera-btn');
        const stopCameraBtn = document.getElementById('stop-camera-btn');
        const sendPingBtn = document.getElementById('send-ping-btn');
        const clearLogBtn = document.getElementById('clear-log-btn');
        const output = document.getElementById('output');
        const connectionStatus = document.getElementById('connection-status');
        const handStatus = document.getElementById('hand-status');
        const processingTime = document.getElementById('processing-time');
        const fingertipData = document.getElementById('fingertip-data');

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            output.textContent += `[${timestamp}] ${message}\n`;
            output.scrollTop = output.scrollHeight;
        }

        function connectWebSocket() {
            const backendType = document.querySelector('input[name="backend"]:checked').value;
            const wsUrl = backendType === 'local' 
                ? 'ws://localhost:8000/api/tracking/live'
                : 'wss://hand-teleop-api.onrender.com/api/tracking/live';
            
            log(`Attempting to connect to ${wsUrl}`);
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                log('✅ WebSocket connected successfully!');
                connectionStatus.textContent = 'Connected';
                connectBtn.textContent = 'Disconnect';
                startCameraBtn.disabled = false;
                sendPingBtn.disabled = false;
            };
            
            ws.onclose = function() {
                log('❌ WebSocket disconnected');
                connectionStatus.textContent = 'Disconnected';
                connectBtn.textContent = 'Connect WebSocket';
                startCameraBtn.disabled = true;
                stopCameraBtn.disabled = true;
                sendPingBtn.disabled = true;
            };
            
            ws.onerror = function(error) {
                log('❌ WebSocket error: ' + error);
            };
            
            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    log('📨 Received: ' + data.type);
                    
                    if (data.type === 'tracking_result' && data.data) {
                        const result = data.data;
                        
                        // Update status
                        handStatus.textContent = result.hand_detected ? 'Yes' : 'No';
                        processingTime.textContent = Math.round(result.processing_time_ms) + 'ms';
                        
                        // Update fingertip data
                        if (result.fingertip_coords) {
                            fingertipData.textContent = JSON.stringify(result.fingertip_coords, null, 2);
                        } else {
                            fingertipData.textContent = 'No fingertip data (hand not detected)';
                        }
                        
                        log(`   Hand: ${result.hand_detected}, Time: ${Math.round(result.processing_time_ms)}ms`);
                        if (result.fingertip_coords) {
                            const thumbTip = result.fingertip_coords.thumb_tip;
                            const indexTip = result.fingertip_coords.index_tip;
                            log(`   Thumb: (${thumbTip.x.toFixed(3)}, ${thumbTip.y.toFixed(3)})`);
                            log(`   Index: (${indexTip.x.toFixed(3)}, ${indexTip.y.toFixed(3)})`);
                        }
                    }
                } catch (e) {
                    log('❌ Error parsing message: ' + e);
                }
            };
        }

        async function startCamera() {
            try {
                log('🎥 Starting camera...');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 }
                });
                
                video = document.getElementById('video');
                video.srcObject = stream;
                
                // Create canvas for capturing frames
                canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = 480;
                
                video.onloadedmetadata = () => {
                    log('✅ Camera started, beginning frame streaming...');
                    startCameraBtn.disabled = true;
                    stopCameraBtn.disabled = false;
                    startStreaming();
                };
                
            } catch (error) {
                log('❌ Camera error: ' + error);
            }
        }

        function stopCamera() {
            if (video && video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            stopStreaming();
            startCameraBtn.disabled = false;
            stopCameraBtn.disabled = true;
            log('🛑 Camera stopped');
        }

        function startStreaming() {
            if (!ws || !video || streaming) return;
            
            streaming = true;
            streamInterval = setInterval(() => {
                sendFrame();
            }, 100); // 10 FPS
        }

        function stopStreaming() {
            streaming = false;
            if (streamInterval) {
                clearInterval(streamInterval);
                streamInterval = null;
            }
        }

        function sendFrame() {
            if (!ws || !video || !canvas) return;
            
            try {
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, 640, 480);
                
                const imageData = canvas.toDataURL('image/jpeg', 0.8);
                
                const message = {
                    type: 'image',
                    data: imageData,
                    tracking_mode: 'mediapipe',
                    robot_type: 'so101',
                    timestamp: new Date().toISOString()
                };
                
                ws.send(JSON.stringify(message));
                
            } catch (error) {
                log('❌ Frame send error: ' + error);
            }
        }

        function sendPing() {
            if (ws) {
                log('📤 Sending ping...');
                ws.send(JSON.stringify({ type: 'ping' }));
            }
        }

        // Event listeners
        connectBtn.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            } else {
                connectWebSocket();
            }
        });

        startCameraBtn.addEventListener('click', startCamera);
        stopCameraBtn.addEventListener('click', stopCamera);
        sendPingBtn.addEventListener('click', sendPing);
        clearLogBtn.addEventListener('click', () => {
            output.textContent = '';
        });

        // Auto-connect on page load
        window.addEventListener('load', () => {
            log('🔄 Page loaded, ready to connect...');
        });
    </script>
</body>
</html>
