<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Debug Tool</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a1a; 
            color: white; 
            padding: 20px; 
            margin: 0;
        }
        .container { max-width: 800px; margin: 0 auto; }
        button { 
            background: #0070f3; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            margin: 5px; 
            border-radius: 5px; 
            cursor: pointer; 
        }
        button:disabled { background: #666; cursor: not-allowed; }
        button.danger { background: #e74c3c; }
        button.success { background: #27ae60; }
        #log { 
            background: #222; 
            padding: 15px; 
            border-radius: 5px; 
            height: 400px; 
            overflow-y: auto; 
            font-family: monospace; 
            font-size: 12px; 
            white-space: pre-wrap; 
            border: 1px solid #444;
        }
        .controls { 
            margin: 20px 0; 
            padding: 15px; 
            background: #333; 
            border-radius: 5px; 
        }
        .status { 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px; 
            font-weight: bold;
        }
        .status.connected { background: #27ae60; }
        .status.disconnected { background: #e74c3c; }
        .status.connecting { background: #f39c12; }
        input[type="text"] {
            background: #444;
            color: white;
            border: 1px solid #666;
            padding: 8px;
            border-radius: 4px;
            width: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebSocket Debug Tool</h1>
        <p>Debug tool for testing the hand tracking WebSocket API</p>
        
        <div class="controls">
            <h3>Connection:</h3>
            <div>
                <label>WebSocket URL:</label><br>
                <input type="text" id="wsUrl" value="ws://localhost:8000/api/tracking/live" placeholder="WebSocket URL">
            </div>
            <div style="margin-top: 10px;">
                <button id="connectBtn" class="success">Connect</button>
                <button id="disconnectBtn" class="danger" disabled>Disconnect</button>
                <button id="clearLogBtn">Clear Log</button>
            </div>
            <div id="status" class="status disconnected">Disconnected</div>
        </div>
        
        <div class="controls">
            <h3>Statistics:</h3>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center;">
                <div>
                    <div style="font-size: 24px; font-weight: bold;" id="messageCount">0</div>
                    <div style="font-size: 12px;">Messages</div>
                </div>
                <div>
                    <div style="font-size: 24px; font-weight: bold;" id="errorCount">0</div>
                    <div style="font-size: 12px;">Errors</div>
                </div>
                <div>
                    <div style="font-size: 24px; font-weight: bold;" id="fps">0</div>
                    <div style="font-size: 12px;">FPS</div>
                </div>
                <div>
                    <div style="font-size: 24px; font-weight: bold;" id="dataSize">0</div>
                    <div style="font-size: 12px;">Bytes/msg</div>
                </div>
            </div>
        </div>

        <h3>Log:</h3>
        <div id="log"></div>
    </div>

    <script>
        let ws = null;
        let messageCount = 0;
        let errorCount = 0;
        let lastMessageTime = 0;
        let fps = 0;

        const wsUrlInput = document.getElementById('wsUrl');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const clearLogBtn = document.getElementById('clearLogBtn');
        const status = document.getElementById('status');
        const log = document.getElementById('log');
        const messageCountEl = document.getElementById('messageCount');
        const errorCountEl = document.getElementById('errorCount');
        const fpsEl = document.getElementById('fps');
        const dataSizeEl = document.getElementById('dataSize');

        function logMessage(message, type = 'info') {
            const timestamp = new Date().toISOString();
            const color = {
                'info': '#ffffff',
                'success': '#27ae60',
                'error': '#e74c3c',
                'warning': '#f39c12'
            }[type] || '#ffffff';
            
            log.innerHTML += `<span style="color: #888">[${timestamp}]</span> <span style="color: ${color}">[${type.toUpperCase()}]</span> ${message}\n`;
            log.scrollTop = log.scrollHeight;
        }

        function updateStats() {
            messageCountEl.textContent = messageCount;
            errorCountEl.textContent = errorCount;
            fpsEl.textContent = fps;
        }

        function calculateFPS() {
            const now = Date.now();
            if (lastMessageTime > 0) {
                const timeDiff = (now - lastMessageTime) / 1000;
                fps = Math.round(1 / timeDiff);
            }
            lastMessageTime = now;
        }

        connectBtn.addEventListener('click', () => {
            const url = wsUrlInput.value.trim();
            if (!url) {
                logMessage('Please enter a WebSocket URL', 'error');
                return;
            }

            logMessage(`Connecting to: ${url}`, 'info');
            status.textContent = 'Connecting...';
            status.className = 'status connecting';

            try {
                ws = new WebSocket(url);

                ws.onopen = () => {
                    logMessage('WebSocket connected successfully', 'success');
                    status.textContent = 'Connected';
                    status.className = 'status connected';
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = false;
                    wsUrlInput.disabled = true;
                };

                ws.onmessage = (event) => {
                    messageCount++;
                    calculateFPS();
                    
                    const dataSize = new Blob([event.data]).size;
                    dataSizeEl.textContent = dataSize;
                    
                    try {
                        const data = JSON.parse(event.data);
                        logMessage(`Received data: ${JSON.stringify(data).substring(0, 100)}...`, 'info');
                        
                        // Log specific hand tracking info
                        if (data.hands && Array.isArray(data.hands)) {
                            logMessage(`Hands detected: ${data.hands.length}`, 'success');
                        }
                        if (data.timestamp) {
                            logMessage(`Timestamp: ${data.timestamp}`, 'info');
                        }
                    } catch (error) {
                        logMessage(`Failed to parse JSON: ${error.message}`, 'error');
                        logMessage(`Raw data: ${event.data.substring(0, 200)}...`, 'warning');
                        errorCount++;
                    }
                    
                    updateStats();
                };

                ws.onclose = (event) => {
                    logMessage(`WebSocket closed. Code: ${event.code}, Reason: ${event.reason || 'No reason provided'}`, 'warning');
                    status.textContent = 'Disconnected';
                    status.className = 'status disconnected';
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                    wsUrlInput.disabled = false;
                };

                ws.onerror = (error) => {
                    logMessage(`WebSocket error: ${error.message || 'Unknown error'}`, 'error');
                    errorCount++;
                    updateStats();
                };

            } catch (error) {
                logMessage(`Failed to create WebSocket: ${error.message}`, 'error');
                status.textContent = 'Error';
                status.className = 'status disconnected';
                errorCount++;
                updateStats();
            }
        });

        disconnectBtn.addEventListener('click', () => {
            if (ws) {
                logMessage('Disconnecting WebSocket...', 'info');
                ws.close();
                ws = null;
            }
        });

        clearLogBtn.addEventListener('click', () => {
            log.innerHTML = '';
            messageCount = 0;
            errorCount = 0;
            fps = 0;
            updateStats();
            logMessage('Log cleared', 'info');
        });

        // Auto-detect localhost vs deployed
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            wsUrlInput.value = `wss://${window.location.host}/api/tracking/live`;
        }

        logMessage('WebSocket Debug Tool initialized', 'success');
    </script>
</body>
</html>
